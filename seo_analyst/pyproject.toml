[project]
name = "seo_analyst"
version = "0.1.0"
description = "seo-analyst using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0",
    "lxml>=6.0.0",
]

[project.scripts]
seo_analyst = "seo_analyst.main:run"
run_crew = "seo_analyst.main:run"
train = "seo_analyst.main:train"
replay = "seo_analyst.main:replay"
test = "seo_analyst.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
